name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    outputs:
      githubSigningReady: ${{ steps.githubSigning.outputs.ready }}
    runs-on: ubuntu-24.04

    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Verify update routing and APK metadata contract
        run: bash scripts/test-update-contract.sh
      - name: Configure existing GitHub APK signing identity
        id: githubSigning
        env:
          MEI_SIGNING_JSON: ${{ secrets.MEI_SIGNING_JSON }}
          EXISTING_SIGNING_READY: false
        run: python3 .github/scripts/setup-github-signing.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --warning-mode=all

      - name: Upload generated Room schemas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: app/schemas/

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: MeiLists-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/output-metadata.json

  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build migration test APK
        run: bash gradlew assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run Room migration and recurrence UI tests on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disk-size: 2048M
          emulator-boot-timeout: 300
          script: bash gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=de.haberland.meilists.AppDatabaseMigrationTest,de.haberland.meilists.ComponentUiTest#addEntryDialogValidatesRepeatInterval
      - name: Upload migration test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  github-updates:
    needs: [build, migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.build.outputs.githubSigningReady == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Download tested signed APK
        run: gh run download "$GITHUB_RUN_ID" --name MeiLists-debug --dir apk
      - name: Publish immutable APK and verified update manifest
        run: python3 .github/scripts/publish-github-update.py
