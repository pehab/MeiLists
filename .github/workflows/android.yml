name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --warning-mode=all

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: MeiLists-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build migration test APK
        run: bash gradlew assembleDebug assembleDebugAndroidTest
      - name: Run Room migration tests on Android 35
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name migration-test --package "system-images;android-35;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -avd migration-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          trap 'adb emu kill || true' EXIT
          timeout 240 adb wait-for-device
          booted=false
          for attempt in {1..120}; do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [[ "$booted" != true ]]; then
            cat "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          adb shell input keyevent 82
          bash gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=de.haberland.meilists.AppDatabaseMigrationTest
      - name: Upload migration test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
